<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Shakthi's Portfolio</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #140e08; overflow: hidden; }
  canvas { display: block; cursor: none; }

  #vignette {
    position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center, rgba(0,0,0,0) 52%, rgba(28,14,4,0.38) 100%);
  }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #7d8698; font: 300 13px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .18em; background: #140e08; pointer-events: none; z-index: 10;
    /* Keeps the screen visibly alive during the parse step, which blocks the
       main thread — a static number there reads as a hang. */
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }

  /* ---- guide ---- */
  #hud {
    position: fixed; left: 22px; bottom: 20px; pointer-events: none;
    font: 400 12px/1.9 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: #e8ecf4; opacity: 0; transform: translateY(6px);
    transition: opacity .45s ease, transform .45s ease;
    text-shadow: 0 1px 6px rgba(0,0,0,.85);
  }
  #hud.show { opacity: 1; transform: none; }
  #hud table { border-collapse: collapse; }
  #hud td { padding: 1px 0; vertical-align: middle; }
  #hud td:first-child { padding-right: 12px; white-space: nowrap; }
  #hud .k {
    display: inline-block; min-width: 20px; padding: 1px 6px; margin-right: 3px;
    border: 1px solid rgba(255,255,255,.30); border-radius: 4px;
    background: rgba(12,16,24,.55); text-align: center; font-size: 11px;
  }
  #hud .act { color: #aeb8c8; }

  /* Focus reticle — pinned dead centre; the pointer steers the view under it. */
  #reticle {
    position: fixed; left: 50%; top: 50%; width: 26px; height: 26px;
    margin: -13px 0 0 -13px; pointer-events: none; z-index: 5;
  }
  #reticle::before, #reticle::after {
    content: ''; position: absolute; left: 50%; top: 50%; border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  #reticle::before {
    width: 5px; height: 5px;
    background: rgba(255,214,170,.95);
    box-shadow: 0 0 8px 2px rgba(255,132,40,.75);
  }
  #reticle::after {
    width: 22px; height: 22px;
    border: 1px solid rgba(255,190,140,.38);
  }

  #pose {
    position: fixed; left: 24px; top: 20px; pointer-events: none;
    font: 400 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em; text-transform: uppercase;
    color: #9aa5b8; text-shadow: 0 1px 6px rgba(0,0,0,.85);
  }

  #hint {
    position: fixed; right: 24px; bottom: 22px; pointer-events: none;
    font: 400 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em; color: #808b9d;
    text-shadow: 0 1px 6px rgba(0,0,0,.85);
    transition: opacity .35s ease;
  }

  #hint.hide { opacity: 0; }

  #poster-cta {
    position: fixed; left: 50%; bottom: 28px; z-index: 6;
    transform: translateX(-50%);
    padding: 10px 20px;
    border-radius: 16px;
    background: rgba(22, 14, 10, 0.42);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 214, 176, 0.28);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    color: #f6e6cc;
    font: 400 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .04em;
    text-align: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity .28s ease;
    white-space: nowrap;
  }
  #poster-cta.show { opacity: 1; }

  /* ---- object info card (reticle hover) ---- */
  #objinfo {
    position: fixed; left: 22px; bottom: 20px; z-index: 7;
    max-width: 340px; padding: 14px 18px; border-radius: 16px;
    background: rgba(22, 14, 10, 0.42);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255, 214, 176, 0.28);
    box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
    color: #f6e6cc; font: 400 13px/1.55 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .02em;
    opacity: 0; transform: translateY(6px); pointer-events: none;
    transition: opacity .28s ease, transform .28s ease;
  }
  #objinfo.show { opacity: 1; transform: none; }
  #objinfo .t {
    display: block; margin-bottom: 5px;
    font: 600 11px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .14em; text-transform: uppercase; color: #ffcfa0;
  }
  @media (prefers-reduced-motion: reduce) { #objinfo { transition: none } }

  /* ---- book reader ---- */
  #book-cta {
    position: fixed; left: 50%; bottom: 28px; z-index: 6; transform: translateX(-50%);
    padding: 10px 20px; border-radius: 16px;
    background: rgba(22,14,10,.42);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid rgba(255,214,176,.28);
    box-shadow: 0 8px 28px rgba(0,0,0,.28);
    color: #f6e6cc; font: 400 13px/1.4 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: .04em; text-align: center;
    opacity: 0; pointer-events: none; transition: opacity .28s ease; white-space: nowrap;
  }
  #book-cta.show { opacity: 1; }

  #book-ui { position: fixed; inset: 0; z-index: 20; pointer-events: none; }
  #book-ui[hidden] { display: none; }
  #book-close {
    position: absolute; top: 18px; right: 20px; width: 40px; height: 40px;
    border-radius: 50%; border: 1px solid rgba(255,214,176,.3);
    background: rgba(20,14,10,.5); color: #f6e6cc; font-size: 22px; line-height: 1;
    cursor: pointer; pointer-events: auto;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  #book-bar {
    position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px; padding: 8px 14px;
    border-radius: 16px; background: rgba(20,14,10,.5);
    border: 1px solid rgba(255,214,176,.28); pointer-events: auto;
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    color: #f6e6cc; font: 400 12px/1 ui-monospace, Menlo, monospace; letter-spacing: .1em;
  }
  #book-bar button {
    width: 34px; height: 34px; border-radius: 10px; cursor: pointer;
    border: 1px solid rgba(255,214,176,.3); background: rgba(255,255,255,.06);
    color: #f6e6cc; font-size: 18px; line-height: 1;
  }
  #book-bar button:disabled { opacity: .3; cursor: default; }
  #book-page { min-width: 92px; text-align: center; }
  body.reading #reticle { display: none; }
  body.reading canvas { cursor: auto; }

  @media (prefers-reduced-motion: reduce) {
    #loading { animation: none }
    #hud { transition: none }
    #poster-cta { transition: none }
  }
  @media (max-width: 640px) { #hud { display: none } }
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="vignette"></div>
  <div id="reticle"></div>

  <div id="pose"></div>
  <div id="hud">
    <table>
      <tr><td><span class="k">W</span><span class="k">A</span><span class="k">S</span><span class="k">D</span></td><td class="act">move</td></tr>
      <tr><td><span class="k">Shift</span></td><td class="act">run</td></tr>
      <tr><td><span class="k">Mouse</span></td><td class="act">steer the focus point</td></tr>
      <tr><td><span class="k">E</span></td><td class="act">sit at the desk</td></tr>
      <tr data-needs="bed"><td><span class="k">F</span></td><td class="act">lie on the bed</td></tr>
      <tr><td><span class="k">C</span></td><td class="act">crouch</td></tr>
      <tr><td><span class="k">Space</span></td><td class="act">stand up</td></tr>
      <tr><td><span class="k">H</span></td><td class="act">keep this open</td></tr>
    </table>
  </div>
  <div id="hint">press H for controls</div>
  <div id="poster-cta">click to know more.</div>
  <div id="objinfo"><span class="t"></span><span class="m"></span></div>

  <div id="book-cta">open the book</div>
  <div id="book-ui" hidden>
    <button id="book-close" aria-label="Close book">×</button>
    <div id="book-bar">
      <button id="book-prev" aria-label="Previous page">‹</button>
      <span id="book-page"></span>
      <button id="book-next" aria-label="Next page">›</button>
    </div>
  </div>

  <div id="loading">starting…</div>

  <script type="importmap">
  { "imports": { "three": "./vendor/three/build/three.module.js" } }
  </script>
  <script type="module" src="./main.js"></script>
</body>
</html>
